spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/api/v1.0

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SQL_DEBUG:false}
spring.jpa.properties.hibernate.format_sql=true

#Query visibility for N+1 detection — enable locally via SQL_DEBUG=true
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_LOG_LEVEL:WARN}
spring.jpa.properties.hibernate.generate_statistics=${SQL_DEBUG:false}
logging.level.org.hibernate.stat=${SQL_LOG_LEVEL:WARN}

# Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

jwt.secret=${JWT_SECRET}

money.manager.frontend.url=${FRONTEND_URL}
app.activation.url=${ACTIVATION_URL}

server.port=${PORT:8080}